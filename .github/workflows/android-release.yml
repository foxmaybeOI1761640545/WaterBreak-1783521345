name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as prerelease"
        type: boolean
        required: true
        default: true
  push:
    branches: [ main, master, work ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.repository }}
  queue: max

jobs:
  build-release:
    # Fork PRs cannot access the fixed signing secrets and are intentionally skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Refresh tags after acquiring release lock
        run: git fetch --force --tags origin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compute globally increasing release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          safe_branch="$(printf '%s' "$branch" | tr '/[:space:]' '--' | tr -cd 'A-Za-z0-9._-')"
          [ -n "$safe_branch" ] || safe_branch="manual"

          # v1.0.6 is the checked-in baseline. Every push/internal PR consumes the
          # next global patch number, regardless of branch.
          latest_patch="$(git tag --list | grep -oE 'v1\.0\.[0-9]+' | sed 's/^v1\.0\.//' | sort -n | tail -1 || true)"
          if [[ -z "$latest_patch" || "$latest_patch" -lt 6 ]]; then
            latest_patch=6
          fi
          next_patch=$((latest_patch + 1))
          version="1.0.${next_patch}"
          version_code=$((next_patch + 1))
          timestamp="$(TZ=Asia/Singapore date +'%Y%m%d-%H%M%S')"
          tag="${timestamp}-${safe_branch}-v${version}"

          prerelease=false
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "$safe_branch" == "work" ]]; then
            prerelease=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease=true
          fi
          channel=$([[ "$prerelease" == "true" ]] && echo beta || echo stable)

          echo "branch=${safe_branch}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=waterbreak-v${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Apply release version to source
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const version = process.env.RELEASE_VERSION
          const versionCode = process.env.RELEASE_VERSION_CODE
          for (const file of ['package.json', 'package-lock.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'))
            json.version = version
            if (json.packages?.['']) json.packages[''].version = version
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`)
          }
          const gradleFile = 'android/app/build.gradle'
          const gradle = fs.readFileSync(gradleFile, 'utf8')
            .replace(/versionCode\s+\d+/, `versionCode ${versionCode}`)
            .replace(/versionName\s+"[^"]+"/, `versionName "${version}"`)
          fs.writeFileSync(gradleFile, gradle)
          NODE
          grep -E 'version(Code|Name)' android/app/build.gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Android
        run: npm run sync:android

      - name: Validate Android Gradle and Kotlin configuration
        env:
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: cd android && gradle :app:tasks --all :app:compileDebugKotlin

      - name: Configure fixed release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS_INPUT: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD_INPUT: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD_INPUT: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS_INPUT ANDROID_KEYSTORE_PASSWORD_INPUT ANDROID_KEY_PASSWORD_INPUT)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name%_INPUT}"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          chmod 600 android/app/release-keystore.jks
          echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/android/app/release-keystore.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_INPUT" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_INPUT" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_INPUT" >> "$GITHUB_ENV"
          keytool -list -keystore android/app/release-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD_INPUT" -alias "$ANDROID_KEY_ALIAS_INPUT" >/dev/null
          expected_signing_sha256="5A491CDBA8BA998F015F637D5925A8A83A2364D5046CEC36CA1E11A467701470"
          actual_signing_sha256="$(keytool -exportcert -keystore android/app/release-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD_INPUT" -alias "$ANDROID_KEY_ALIAS_INPUT" | sha256sum | awk '{print toupper($1)}')"
          if [[ "$actual_signing_sha256" != "$expected_signing_sha256" ]]; then
            echo "Signing certificate SHA-256 mismatch. Expected $expected_signing_sha256 but got $actual_signing_sha256"
            exit 1
          fi
          echo "Signing certificate SHA-256 verified: $actual_signing_sha256"

      - name: Build signed release APK
        env:
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: cd android && gradle assembleRelease

      - name: Verify and prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/waterbreak.apk
          cp release/waterbreak.apk "release/waterbreak-v${RELEASE_VERSION}.apk"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs release/waterbreak.apk
          sha256="$(sha256sum release/waterbreak.apk | awk '{print $1}')"
          size="$(stat -c '%s' release/waterbreak.apk)"
          export published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/waterbreak.apk"
          export release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          export sha256 size

          node - <<'NODE'
          const fs = require('fs')
          const manifest = {
            schemaVersion: 1,
            appId: 'com.randomwaterreminder.app',
            channel: process.env.RELEASE_CHANNEL,
            versionName: process.env.RELEASE_VERSION,
            versionCode: Number(process.env.RELEASE_VERSION_CODE),
            minimumSupportedVersionCode: 7,
            mandatory: false,
            prerelease: process.env.RELEASE_PRERELEASE === 'true',
            publishedAt: process.env.published_at,
            apkUrl: process.env.apk_url,
            releasePageUrl: process.env.release_url,
            sha256: process.env.sha256,
            size: Number(process.env.size),
            releaseNotes: [
              `GitHub Actions 自动构建 ${process.env.RELEASE_TAG}`,
              `来源分支：${process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME}`,
              `提交：${process.env.GITHUB_SHA.slice(0, 12)}`
            ]
          }
          fs.writeFileSync('release/update.json', `${JSON.stringify(manifest, null, 2)}\n`)
          NODE

      - name: Create versioned source tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android/app/build.gradle
          git commit -m "chore(release): v${{ steps.release.outputs.version }} [skip ci]"
          git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: waterbreak-v${{ steps.release.outputs.version }}
          path: |
            release/waterbreak.apk
            release/waterbreak-v${{ steps.release.outputs.version }}.apk
            release/update.json
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          body: |
            Automated ${{ steps.release.outputs.channel }} release for `${{ steps.release.outputs.tag }}`.

            - App version: `${{ steps.release.outputs.version }}`
            - Version code: `${{ steps.release.outputs.version_code }}`
            - Source branch: `${{ steps.release.outputs.branch }}`
            - Fixed install asset: `waterbreak.apk`
            - Update metadata: `update.json`
          files: |
            release/waterbreak.apk
            release/waterbreak-v${{ steps.release.outputs.version }}.apk
            release/update.json
          fail_on_unmatched_files: true
          generate_release_notes: true
